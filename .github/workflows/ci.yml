# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# Replaces the previous inline CI job (Ruff check + offline pytest on 3.11), which the shared
# ci-python job covers. The scraper runs from local cron (setup_cron.sh), not from Actions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scraper:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      python-version: "3.11" # same as the previous CI; ruff.toml targets py310
      # Tests are offline: fixtures only, no live site traffic.

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
